{% extends "base.html" %}
{% block title %}Категории меню{% endblock %}
{% block content %}
<div class="page-header"><h1>Категории меню</h1></div>
<div class="grid grid--2">
    <div class="card">
        <h3 class="mt-0">Список категорий</h3>
        <table>
            <tbody>
            {% for c in categories %}<tr><td>{{ c['name'] }}</td></tr>{% else %}<tr><td class="empty-state">Категорий нет</td></tr>{% endfor %}
            </tbody>
        </table>
    </div>
    <div class="card">
        <h3 class="mt-0">Добавить категорию</h3>
        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="field"><label for="name">Название</label><input type="text" id="name" name="name" required></div>
            <button class="btn" type="submit">Добавить</button>
        </form>
    </div>
</div>
{% endblock %}
