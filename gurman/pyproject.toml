[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations", ".venv", "instance"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4"]
ignore = [
    "S101",  # assert — нужен в тестах
    "E501",  # длинные строки — допускаем в docstring
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S107"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "*/migrations/*", "instance/*", "*/__init__.py"]