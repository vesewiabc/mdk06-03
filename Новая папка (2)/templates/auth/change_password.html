{% extends "base.html" %}
{% block title %}Смена пароля{% endblock %}

{% block content %}

<div class="page-header">
    <div>
        <h1>Смена пароля</h1>
        <p class="subtitle">Смена собственного пароля учётной записи</p>
    </div>
</div>

<div class="card card--narrow">
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="field">
            <label for="old_password">Текущий пароль</label>
            <input type="password" id="old_password" name="old_password"
                   required autocomplete="current-password">
        </div>

        <div class="field">
            <label for="new_password">Новый пароль</label>
            <input type="password" id="new_password" name="new_password"
                   required minlength="10" maxlength="128"
                   autocomplete="new-password"
                   title="Минимум 10 символов, буква + цифра">
        </div>

        <div class="field">
            <label for="new_password_confirm">Повторите новый пароль</label>
            <input type="password" id="new_password_confirm"
                   name="new_password_confirm"
                   required minlength="10" maxlength="128"
                   autocomplete="new-password">
        </div>

        <div class="form-actions btn-row">
            <button class="btn" type="submit">Сменить пароль</button>
            <a class="btn btn--secondary" href="{{ url_for('index') }}">Отмена</a>
        </div>
    </form>
</div>

{% endblock %}
