{% extends "base.html" %}
{% block title %}Новый сотрудник{% endblock %}
{% block content %}
<div class="page-header"><h1>Приём сотрудника</h1></div>
<div class="card" style="max-width:420px;">
    <form method="post">
        <div class="field"><label for="full_name">ФИО</label><input type="text" id="full_name" name="full_name" required></div>
        <div class="field"><label for="position">Должность</label><input type="text" id="position" name="position" required></div>
        <div class="field"><label for="phone">Телефон</label><input type="text" id="phone" name="phone"></div>
        <div class="field"><label for="hired_at">Дата приёма</label><input type="date" id="hired_at" name="hired_at"></div>
        <div class="field"><label for="salary">Оклад, ₽</label><input type="number" step="0.01" id="salary" name="salary" value="0"></div>
        <div class="form-actions btn-row">
            <button class="btn" type="submit">Принять</button>
            <a class="btn btn--secondary" href="{{ url_for('staff.list_employees') }}">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
