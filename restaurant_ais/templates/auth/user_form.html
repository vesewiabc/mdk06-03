{% extends "base.html" %}
{% block title %}Новый пользователь{% endblock %}
{% block content %}
<div class="page-header"><h1>Новый пользователь</h1></div>
<div class="card" style="max-width:420px;">
    <form method="post">
        <div class="field">
            <label for="full_name">ФИО</label>
            <input type="text" id="full_name" name="full_name" required>
        </div>
        <div class="field">
            <label for="username">Логин</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div class="field">
            <label for="password">Пароль</label>
            <input type="password" id="password" name="password" required>
        </div>
        <div class="field">
            <label for="role">Роль</label>
            <select id="role" name="role">
                {% for code, label in role_labels.items() %}
                <option value="{{ code }}">{{ label }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-actions btn-row">
            <button class="btn" type="submit">Создать</button>
            <a class="btn btn--secondary" href="{{ url_for('auth.users') }}">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
